
name: Deploy CareFlow OPD Prototype

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/**'
      - '.github/workflows/deploy-careflow-opd.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload prototype files
        uses: actions/upload-pages-artifact@v4
        with:
          path: './prototype'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
